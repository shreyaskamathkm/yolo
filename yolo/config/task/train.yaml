task: train

defaults:
  - validation: ../validation

epoch: 10

data:
  batch_size: 2
  equivalent_batch_size: 10
  drop_last: True
  image_size: ${image_size}
  dataloader_workers: 4
  shuffle: True
  pin_memory: True
  redo_cache: true
  data_augment:
    - type: Mosaic
      prob: 1
    - type: HorizontalFlip
      prob: 0.5
    - type: RandomCrop
      prob: 1
    - type: RemoveOutliers
      min_box_area: 1e-8

optimizer:
  type: SGD
  args:
    lr: 0.01
    weight_decay: 0.0005
    momentum: 0.937
    nesterov: true

loss:
  type: YOLO
  gamma: 1.0
  objective:
    BCELoss: 0.5
    BoxLoss: 7.5
    DFLoss: 1.5
  aux: 0.25
  matcher:
    iou: CIoU
    topk: 10
    factor:
      iou: 6.0
      cls: 0.5


scheduler:
  type: LinearLR
  warmup:
    epochs: 3.0
    start_momentum: 0.8
    end_momentum: 0.937
  args:
    total_iters: ${task.epoch}
    start_factor: 1
    end_factor: 0.01

ema:
  enable: true
  decay: 0.9999
